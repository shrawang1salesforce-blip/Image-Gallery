<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A small collection of photographs from slow mornings and open roads."
    />
    <title>Sunday Light | Image Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="index.html" aria-label="Sunday Light home">
        <span class="wordmark-mark">SL</span>
        <span>Sunday Light</span>
      </a>
      <p class="header-note">A personal collection / 2024</p>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Field notes in pictures</p>
        <h1 id="page-title">Little moments,<br /><em>well noticed.</em></h1>
        <p class="intro-copy">
          A loose collection of places, textures, and quiet corners that made an
          ordinary day feel worth keeping.
        </p>
      </section>

      <section class="gallery-section" aria-labelledby="gallery-title">
        <div class="section-heading">
          <h2 id="gallery-title">The collection</h2>
          <div class="filters" role="group" aria-label="Filter photographs">
            <button
              class="filter-button is-active"
              type="button"
              data-filter="all"
            >
              All <span>08</span>
            </button>
            <button class="filter-button" type="button" data-filter="outside">
              Outside <span>04</span>
            </button>
            <button class="filter-button" type="button" data-filter="inside">
              Inside <span>04</span>
            </button>
          </div>
        </div>

        <div class="gallery-grid">
          <button
            class="gallery-item item-wide"
            type="button"
            data-category="outside"
            data-title="Late afternoon, somewhere north"
            data-location="Outside / 01"
            data-image="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=85"
          >
            <img
              src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=85"
              alt="A person walking through a golden grassy field"
              loading="eager"
            />
            <span class="item-caption"
              ><strong>Late afternoon, somewhere north</strong
              ><small>Outside / 01</small></span
            >
          </button>
          <button
            class="gallery-item item-tall"
            type="button"
            data-category="inside"
            data-title="A quiet table by the window"
            data-location="Inside / 01"
            data-image="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1200&q=85"
          >
            <img
              src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=900&q=85"
              alt="A cup of coffee on a wooden cafe table"
              loading="lazy"
            />
            <span class="item-caption"
              ><strong>A quiet table by the window</strong
              ><small>Inside / 01</small></span
            >
          </button>
          <button
            class="gallery-item"
            type="button"
            data-category="outside"
            data-title="The long way home"
            data-location="Outside / 02"
            data-image="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=85"
          >
            <img
              src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=85"
              alt="A winding road between green hills"
              loading="lazy"
            />
            <span class="item-caption"
              ><strong>The long way home</strong
              ><small>Outside / 02</small></span
            >
          </button>
          <button
            class="gallery-item"
            type="button"
            data-category="inside"
            data-title="Lines from an old book"
            data-location="Inside / 02"
            data-image="https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=1200&q=85"
          >
            <img
              src="https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=900&q=85"
              alt="An open book and reading glasses in warm light"
              loading="lazy"
            />
            <span class="item-caption"
              ><strong>Lines from an old book</strong
              ><small>Inside / 02</small></span
            >
          </button>
          <button
            class="gallery-item item-wide"
            type="button"
            data-category="outside"
            data-title="Blue hour on the water"
            data-location="Outside / 03"
            data-image="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1600&q=85"
          >
            <img
              src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1200&q=85"
              alt="Sun setting over a calm lake"
              loading="lazy"
            />
            <span class="item-caption"
              ><strong>Blue hour on the water</strong
              ><small>Outside / 03</small></span
            >
          </button>
          <button
            class="gallery-item"
            type="button"
            data-category="inside"
            data-title="Morning arrangement"
            data-location="Inside / 03"
            data-image="https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=1200&q=85"
          >
            <img
              src="https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=900&q=85"
              alt="A small vase of flowers on a desk"
              loading="lazy"
            />
            <span class="item-caption"
              ><strong>Morning arrangement</strong
              ><small>Inside / 03</small></span
            >
          </button>
          <button
            class="gallery-item"
            type="button"
            data-category="outside"
            data-title="After the rain"
            data-location="Outside / 04"
            data-image="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=85"
          >
            <img
              src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=85"
              alt="Mountain peaks under a cloudy sky"
              loading="lazy"
            />
            <span class="item-caption"
              ><strong>After the rain</strong><small>Outside / 04</small></span
            >
          </button>
          <button
            class="gallery-item"
            type="button"
            data-category="inside"
            data-title="A chair in the sun"
            data-location="Inside / 04"
            data-image="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1200&q=85"
          >
            <img
              src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=900&q=85"
              alt="A quiet reading chair beside a sunny window"
              loading="lazy"
            />
            <span class="item-caption"
              ><strong>A chair in the sun</strong
              ><small>Inside / 04</small></span
            >
          </button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>Collected slowly.</span>
      <span>Scroll to wander <b>↓</b></span>
    </footer>

    <dialog class="lightbox" aria-labelledby="lightbox-title">
      <button
        class="close-button"
        type="button"
        aria-label="Close image preview"
      >
        ×
      </button>
      <div class="lightbox-image-wrap">
        <img class="lightbox-image" src="" alt="" />
      </div>
      <div class="lightbox-details">
        <p class="lightbox-location"></p>
        <h2 id="lightbox-title"></h2>
      </div>
    </dialog>
  </body>
</html>
